<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pedalera Web - Guitar FX</title>
  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --text: #f0f0f0;
      --focus: #00ffcc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 15px;
      background: #0a0a0a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    h1 { font-size: 1.1rem; letter-spacing: 1px; }
    #power-btn {
      background: #e63946;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
    }
    #power-btn.active { background: #2a9d8f; }
    
    .instructions {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      padding: 8px;
      background: #161616;
    }

    /* Contenedor de pedales (Scroll horizontal en celular) */
    .pedalboard {
      display: flex;
      gap: 15px;
      padding: 20px;
      overflow-x: auto;
      flex: 1;
      align-items: center;
      scroll-snap-type: x mandatory;
    }

    .pedal {
      min-width: 220px;
      height: 360px;
      background: var(--panel);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 3px solid #333;
      scroll-snap-align: center;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      position: relative;
    }

    /* Marco de selección para flechas del teclado */
    .pedal.selected {
      border-color: var(--focus);
      box-shadow: 0 0 18px rgba(0, 255, 204, 0.3);
      transform: translateY(-5px);
    }

    .pedal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pedal-title {
      font-weight: 800;
      font-size: 1.1rem;
      text-transform: uppercase;
    }
    .led {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #444;
      box-shadow: inset 0 0 4px #000;
    }
    .pedal.on .led {
      background: #ff2a2a;
      box-shadow: 0 0 12px #ff2a2a;
    }

    /* Colores distintivos por pedal */
    .pedal[data-fx="wah"] { background: linear-gradient(180deg, #2b2d42, #1a1b26); }
    .pedal[data-fx="drive"] { background: linear-gradient(180deg, #6a040f, #370617); }
    .pedal[data-fx="chorus"] { background: linear-gradient(180deg, #005f73, #001219); }
    .pedal[data-fx="psycho"] { background: linear-gradient(180deg, #5a189a, #240046); }
    .pedal[data-fx="delay"] { background: linear-gradient(180deg, #ca6702, #5f0f40); }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      my: auto;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label { font-size: 0.75rem; text-transform: uppercase; color: #ccc; }
    input[type="range"] {
      width: 100%;
      accent-color: var(--focus);
      height: 24px;
    }

    /* Botón pisable (Footswitch) */
    .footswitch {
      background: #d9d9d9;
      color: #111;
      border: 4px solid #888;
      border-radius: 50%;
      width: 68px;
      height: 68px;
      margin: 0 auto;
      font-weight: bold;
      font-size: 0.7rem;
      cursor: pointer;
      box-shadow: 0 6px 0 #555, 0 10px 15px rgba(0,0,0,0.6);
      active: transform: translateY(4px);
    }
    .footswitch:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #555;
    }
  </style>
</head>
<body>

  <header>
    <h1>GUITAR FX RACK</h1>
    <button id="power-btn">ENCENDER AUDIO</button>
  </header>
  <div class="instructions">
    Móvil: Tocá el botón metálico | PC: Flechas ◄ ► para elegir, ESPACIO para activar
  </div>

  <div class="pedalboard" id="pedalboard">
    <!-- 1. GUAGUA (AUTO-WAH) -->
    <div class="pedal selected" data-fx="wah" data-index="0">
      <div class="pedal-header">
        <span class="pedal-title">Guagua</span>
        <div class="led"></div>
      </div>
      <div class="controls">
        <div class="control-group">
          <label>Velocidad Barrido</label>
          <input type="range" id="wah-rate" min="0.5" max="8" step="0.1" value="2.5">
        </div>
        <div class="control-group">
          <label>Profundidad (Q)</label>
          <input type="range" id="wah-depth" min="2" max="15" step="0.5" value="8">
        </div>
      </div>
      <button class="footswitch" onclick="togglePedal(0)">PISAR</button>
    </div>

    <!-- 2. OVERDRIVE -->
    <div class="pedal" data-fx="drive" data-index="1">
      <div class="pedal-header">
        <span class="pedal-title">Overdrive</span>
        <div class="led"></div>
      </div>
      <div class="controls">
        <div class="control-group">
          <label>Ganancia (Distorsión)</label>
          <input type="range" id="drive-gain" min="0" max="400" step="10" value="120">
        </div>
        <div class="control-group">
          <label>Volumen Salida</label>
          <input type="range" id="drive-level" min="0.1" max="1.5" step="0.05" value="0.7">
        </div>
      </div>
      <button class="footswitch" onclick="togglePedal(1)">PISAR</button>
    </div>

    <!-- 3. CHORUS -->
    <div class="pedal" data-fx="chorus" data-index="2">
      <div class="pedal-header">
        <span class="pedal-title">Chorus</span>
        <div class="led"></div>
      </div>
      <div class="controls">
        <div class="control-group">
          <label>Velocidad (Rate)</label>
          <input type="range" id="chorus-rate" min="0.5" max="6" step="0.1" value="1.5">
        </div>
        <div class="control-group">
          <label>Mezcla</label>
          <input type="range" id="chorus-mix" min="0" max="1" step="0.05" value="0.5">
        </div>
      </div>
      <button class="footswitch" onclick="togglePedal(2)">PISAR</button>
    </div>

    <!-- 4. PSICODÉLICO (PHASER ESPACIAL) -->
    <div class="pedal" data-fx="psycho" data-index="3">
      <div class="pedal-header">
        <span class="pedal-title">Psicodélico</span>
        <div class="led"></div>
      </div>
      <div class="controls">
        <div class="control-group">
          <label>Viaje (Oscilación)</label>
          <input type="range" id="psycho-rate" min="0.1" max="5" step="0.1" value="0.6">
        </div>
        <div class="control-group">
          <label>Resonancia Espacial</label>
          <input type="range" id="psycho-feedback" min="0.1" max="0.88" step="0.02" value="0.7">
        </div>
      </div>
      <button class="footswitch" onclick="togglePedal(3)">PISAR</button>
    </div>

    <!-- 5. DELAY -->
    <div class="pedal" data-fx="delay" data-index="4">
      <div class="pedal-header">
        <span class="pedal-title">Delay</span>
        <div class="led"></div>
      </div>
      <div class="controls">
        <div class="control-group">
          <label>Tiempo (
